<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Register an account for Secret Shop.">
	<title>Secret Shop | Register</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #24243a;
			--muted: #69697c;
			--purple: #6d4be8;
			--purple-dark: #5234c3;
			--paper: #fff;
			--wash: #f7f5ff;
			--error: #b42318;
			--success: #027a48;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			color: var(--ink);
			background: linear-gradient(135deg, #f8f6ff, #eeebff);
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
		}
		a { color: inherit; text-decoration: none; }
		.auth-card {
			width: min(420px, 100%);
			padding: 34px;
			border: 1px solid #eeedf3;
			border-radius: 18px;
			background: white;
			box-shadow: 0 18px 50px #29204412;
		}
		.brand {
			font-size: 1.45rem;
			font-weight: 850;
			letter-spacing: -.06em;
			white-space: nowrap;
			display: inline-block;
			margin-bottom: 8px;
		}
		.brand span { color: var(--purple); }
		.auth-card h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -.05em; }
		.auth-card > p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
		.auth-card form { display: grid; gap: 14px; }
		.auth-card label { display: grid; gap: 6px; font-size: .9rem; font-weight: 650; }
		input {
			width: 100%;
			padding: 12px 13px;
			border: 1px solid #dedbe9;
			border-radius: 8px;
			font: inherit;
		}
		input:focus {
			outline: none;
			border-color: var(--purple);
			box-shadow: 0 0 0 3px rgba(109, 75, 232, 0.15);
		}
		button {
			width: 100%;
			padding: 12px 17px;
			border: 0;
			border-radius: 8px;
			color: white;
			background: var(--purple);
			font: inherit;
			font-weight: 700;
			cursor: pointer;
			transition: background 0.15s;
		}
		button:hover { background: var(--purple-dark); }
		.auth-switch { margin-top: 20px !important; text-align: center; font-size: .92rem; }
		.auth-switch a { color: var(--purple); font-weight: 700; }
		.auth-switch a:hover { text-decoration: underline; }
		.auth-message {
			min-height: 1.4em;
			margin: 14px 0 0 !important;
			font-size: .9rem;
			text-align: center;
		}
		.auth-message.error { color: var(--error) !important; }
		.auth-message.success { color: var(--success) !important; }
	</style>
</head>
<body>
	<section class="auth-card" id="register-section" aria-labelledby="register-heading">
		<a class="brand" href="index.html">Secret <span>Shop</span></a>
		<h1 id="register-heading">Create your account</h1>
		<p>Join the Secret Shop collector community.</p>
		<form id="register-form">
			<label for="register-name">Name<input id="register-name" name="name" autocomplete="name" required></label>
			<label for="register-username">Username<input id="register-username" name="username" autocomplete="username" required></label>
			<label for="register-password">Password<input id="register-password" name="password" type="password" autocomplete="new-password" minlength="4" required></label>
			<button type="submit">Register</button>
		</form>
		<p class="auth-message" id="register-message" role="alert" aria-live="polite"></p>
		<p class="auth-switch">Already registered? <a href="index.html">Log in</a></p>
	</section>

	<script src="js/code.js"></script>
</body>
</html>
